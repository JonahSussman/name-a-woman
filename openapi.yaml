openapi: 3.1.0
info:
  title: Name a Woman API
  version: 0.1.0
  description: |
    Speed-naming game — name 100 women (or men, or people) as fast as possible, validated against Wikidata.

    ## Game Loop (WebSocket)

    The game lifecycle uses a WebSocket connection at `GET /api/game/ws`.

    ### Client → Server messages

    **Start a game:**
    ```json
    {"action": "start", "category": "women", "target_count": 100}
    ```

    **Submit a guess:**
    ```json
    {"action": "guess", "name": "Marie Curie"}
    ```

    ### Server → Client messages

    **Game started:**
    ```json
    {"type": "started", "game_id": "uuid"}
    ```

    **Accepted (exact match):**
    ```json
    {"type": "accepted", "person": {...}, "accepted_count": 42, "game_complete": false}
    ```

    **Accepted (fuzzy, edit distance ≤ 2):**
    ```json
    {"type": "accepted", "person": {...}, "corrected_from": "Beyonec", "accepted_count": 43, "game_complete": false}
    ```

    **Game complete (Nth accepted guess):**
    ```json
    {"type": "accepted", "person": {...}, "accepted_count": 100, "game_complete": true,
     "completion": {"total_time_ms": 120000, "rank": 15, "total_players": 230, "percentile": 93.5}}
    ```

    **Already guessed:**
    ```json
    {"type": "already_guessed", "person": {"display_name": "Marie Curie", ...}}
    ```

    **Wrong category:**
    ```json
    {"type": "wrong_category", "person": {"display_name": "Albert Einstein", ...}}
    ```

    **Not found:**
    ```json
    {"type": "not_found"}
    ```

    **Wikidata fallback exhausted:**
    ```json
    {"type": "not_found", "fallback_exhausted": true}
    ```

    **Game timeout (5 min without a correct guess):**
    ```json
    {"type": "game_timeout", "elapsed_ms": 300000}
    ```

    **Error:**
    ```json
    {"type": "error", "message": "..."}
    ```

    ### Timeout behavior

    The server enforces a 5-minute inactivity timeout. The timer resets **only on accepted guesses** —
    rejected guesses do not keep the clock alive. When the timeout fires, the server sends a
    `game_timeout` message and closes the WebSocket connection.

servers:
  - url: /api

paths:
  /game/ws:
    get:
      summary: WebSocket game endpoint
      operationId: gameWebSocket
      description: |
        Upgrades to WebSocket for the game loop. See API description for message protocol.
        Connection lifecycle: start → guess → guess → ... → complete/timeout/disconnect.
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)

  /leaderboard:
    get:
      summary: Get leaderboard
      operationId: leaderboard
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [women, men, people]
            default: women
        - name: count
          in: query
          schema:
            type: integer
            enum: [10, 100, 1000]
            default: 100
        - name: game_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: If provided, includes your_neighborhood relative to this game
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: If provided, includes paginated full_leaderboard (50 per page)
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  /stats/game/{gameId}:
    get:
      summary: Get detailed stats for a completed game
      operationId: gameStats
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Game statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStatsResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: OK

components:
  schemas:
    Person:
      type: object
      required: [wikidata_id, display_name, gender, wikidata_url]
      properties:
        wikidata_id:
          type: string
        display_name:
          type: string
        gender:
          type: string
          enum: [female, male, other]
        wikipedia_url:
          type: string
          format: uri
        wikidata_url:
          type: string
          format: uri

    CompletionData:
      type: object
      required: [total_time_ms, rank, total_players, percentile]
      properties:
        total_time_ms:
          type: integer
        rank:
          type: integer
        total_players:
          type: integer
        percentile:
          type: number
          format: double

    LeaderboardResponse:
      type: object
      required: [top_10, bottom_10]
      properties:
        top_10:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        bottom_10:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        your_neighborhood:
          $ref: "#/components/schemas/Neighborhood"
        full_leaderboard:
          $ref: "#/components/schemas/PaginatedLeaderboard"

    LeaderboardEntry:
      type: object
      required: [rank, total_time_ms, accepted_count, category, is_you]
      properties:
        rank:
          type: integer
        total_time_ms:
          type: integer
        accepted_count:
          type: integer
        category:
          type: string
        is_you:
          type: boolean

    Neighborhood:
      type: object
      required: [above, you, below]
      properties:
        above:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        you:
          $ref: "#/components/schemas/LeaderboardEntry"
        below:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"

    PaginatedLeaderboard:
      type: object
      required: [entries, page, total_pages, total_entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        page:
          type: integer
        total_pages:
          type: integer
        total_entries:
          type: integer

    GameStatsResponse:
      type: object
      required: [game, guesses]
      properties:
        game:
          type: object
          required: [category, target_count, accepted_count]
          properties:
            total_time_ms:
              type: integer
            category:
              type: string
            target_count:
              type: integer
            accepted_count:
              type: integer
        guesses:
          type: array
          items:
            $ref: "#/components/schemas/GuessSummary"
        ranking:
          $ref: "#/components/schemas/CompletionData"

    GuessSummary:
      type: object
      required: [order, display_name, guess_time_ms, wikidata_url]
      properties:
        order:
          type: integer
        display_name:
          type: string
        guess_time_ms:
          type: integer
        wikipedia_url:
          type: string
          format: uri
        wikidata_url:
          type: string
          format: uri

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
